<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>StockPro - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body class="login-page">
    <main class="main-content">
        <div class="card login-card p-4 shadow-lg" style="width: 380px;">
            <div class="text-center mb-4">
                <div class="bg-primary-subtle rounded-circle d-inline-flex p-3 mb-3">
                    <span class="material-icons-round text-primary" style="font-size: 40px;">inventory_2</span>
                </div>
                <h3 class="fw-bold">Bienvenido</h3>
                <p class="text-muted small">Ingresa al Sistema de Inventario</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }} py-2 small border-0">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Usuario</label>
                    <input type="text" name="username" class="form-control bg-light" placeholder="admin" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold">Contraseña</label>
                    <input type="password" name="password" class="form-control bg-light" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow">INGRESAR</button>
            </form>
        </div>
    </main>
</body>
</html>
